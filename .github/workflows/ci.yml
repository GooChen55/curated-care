name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/commerce/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.runtime.txt
            requirements.test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.test.txt
      - name: Python tests
        run: python -m pytest tests/test_knowledge.py tests/test_dialogue.py tests/test_model_adapter.py -q
      - name: Java tests and frontend build
        run: python scripts/manage.py build
      - name: Validate container configuration
        run: docker compose config --quiet
      - name: Start demo services
        run: python scripts/manage.py start
      - name: Wait for services
        run: |
          for attempt in {1..30}; do
            if python scripts/manage.py status | tee /tmp/care-status | grep -q 'unavailable'; then
              sleep 3
            else
              exit 0
            fi
          done
          exit 1
      - name: HTTP integration tests
        env:
          CURATED_CARE_E2E: '1'
        run: python -m pytest tests/test_e2e.py -q
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: .runtime/*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop services
        if: always()
        run: python scripts/manage.py stop
